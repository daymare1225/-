[package]
name = "input-pet-clicker"
version = "0.1.1"
description = "A desktop input-reactive clicker"
authors = ["you"]
edition = "2021"

[lib]
name = "input_pet_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# rdev 0.5.x crashes on macOS when its keyboard-layout API is used from the
# background listener thread. Keep this revision fixed for reproducible builds.
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
