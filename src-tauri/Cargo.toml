[package]
name = "input-pet-clicker"
version = "0.1.1"
description = "A desktop input-reactive clicker"
authors = ["you"]
edition = "2021"

[lib]
name = "input_pet_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
